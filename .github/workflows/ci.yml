name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and declared development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify installed packages outside the repository
        working-directory: /tmp
        run: python -c "import helpdesktool, linux_agent; print(helpdesktool.__file__, linux_agent.__file__)"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check endpoint agent and dependency-free contracts
        run: mypy linux_agent helpdesktool/events.py helpdesktool/integrations.py

      - name: Test
        run: pytest
