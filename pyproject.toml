[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesktool"
version = "0.1.0"
description = "Safety-first orchestration core for an autonomous IT help desk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["helpdesktool*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
