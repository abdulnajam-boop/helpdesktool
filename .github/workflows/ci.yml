name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpdesk_test
          POSTGRES_PASSWORD: helpdesk_test
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk_test -d helpdesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      HELPDESK_TEST_DATABASE_URL: postgresql+psycopg://helpdesk_test:helpdesk_test@localhost:5432/helpdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev,windows]'
      - run: python -m compileall helpdesktool linux_agent windows_agent
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
