server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Mirrors helpdesktool/hardening.py's SecurityHeadersMiddleware for the
  # SPA itself -- that middleware only ever covers the API's own JSON
  # responses, never anything nginx serves. __CSP_CONNECT_SRC__ is replaced
  # at image build time (see frontend/Dockerfile) with 'self' plus the
  # build-time VITE_API_URL origin, since the SPA is a static bundle that
  # can only ever call whatever API origin it was built against.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src __CSP_CONNECT_SRC__; frame-ancestors 'none'; base-uri 'none'" always;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
