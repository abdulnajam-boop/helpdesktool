name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpdesk_test
          POSTGRES_PASSWORD: helpdesk_test
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk_test -d helpdesk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      HELPDESK_TEST_DATABASE_URL: postgresql+psycopg://helpdesk_test:helpdesk_test@localhost:5432/helpdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev,windows]'
      - run: python -m compileall helpdesktool linux_agent windows_agent
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans commit history, not just the working tree.
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev,windows]'
      - run: python -m pip install pip-audit
      - name: Audit backend Python dependencies
        run: python -m pip_audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit frontend npm dependencies
        working-directory: frontend
        run: |
          npm install
          npm audit --audit-level=high
      - name: Generate backend SBOM (CycloneDX)
        # The CVE gate already ran in the "Audit backend Python
        # dependencies" step above -- this step's only job is producing
        # the artifact, so it must not become a second, redundant gate.
        # pip_audit still exits non-zero (and still writes the SBOM file
        # correctly either way) whenever it finds a vulnerability in any
        # installed package, including pip itself (the installer tool,
        # not a project dependency -- see docs/DEPENDENCY_AUDIT.md); `||
        # true` here is deliberate, not a swallowed real failure.
        run: python -m pip_audit --format=cyclonedx-json -o sbom-backend.cdx.json || true
      - name: Generate frontend SBOM (CycloneDX)
        working-directory: frontend
        run: npm sbom --sbom-format=cyclonedx > sbom-frontend.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-backend.cdx.json
            frontend/sbom-frontend.cdx.json
          retention-days: 90
  docker:
    runs-on: ubuntu-latest
    # packages: write and id-token: write are only needed for the publish/
    # sign steps below, which only ever run on a push to main (never a PR,
    # so untrusted PR code can never publish or sign anything) -- scoped to
    # this job alone rather than the workflow-wide `permissions:` block at
    # the top, least-privilege.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t helpdesktool-api:ci .
      - name: Scan the API image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: helpdesktool-api:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Smoke-test the API image actually starts and serves traffic
        # Catches import-time/startup failures that a plain `docker build`
        # can't (a bad COPY list, a missing package -- exactly the class of
        # bug that let helpdesktool/job_signing.py's `agent_common` import
        # ship broken in the real image while every non-Docker test passed).
        # /health/live deliberately touches no database, so no DB service is
        # needed here -- it only needs the app to import and uvicorn to bind.
        run: |
          docker run -d --name api-smoke -p 8000:8000 helpdesktool-api:ci
          ok=""
          for _ in $(seq 1 20); do
            if curl -fs http://localhost:8000/health/live >/dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs api-smoke
          docker rm -f api-smoke
          [ -n "$ok" ] || (echo "API container never became healthy" && exit 1)
      - name: Log in to GHCR
        # Only ever publishes what already passed the scan and smoke test
        # above, and only from main -- never a PR, so untrusted PR code
        # can never publish or sign an image under this project's identity.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
      - name: Publish and keylessly sign the API image
        # Keyless signing (Sigstore Fulcio/Rekor via this job's own GitHub
        # Actions OIDC token, id-token: write above) -- no signing key or
        # extra secret to generate, store, or rotate. Signs the pushed
        # image's immutable digest, not a mutable tag, then verifies the
        # signature round-trips for real rather than trusting `cosign sign`
        # exited 0.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}-api
        run: |
          image="${IMAGE,,}"
          docker tag helpdesktool-api:ci "$image:${{ github.sha }}"
          docker tag helpdesktool-api:ci "$image:latest"
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
          digest=$(docker image inspect --format='{{index .RepoDigests 0}}' "$image:${{ github.sha }}")
          cosign sign --yes "$digest"
          cosign verify "$digest" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Build the frontend image
        run: docker build -t helpdesktool-frontend:ci ./frontend
      - name: Scan the frontend image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: helpdesktool-frontend:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Smoke-test the frontend image serves the app
        run: |
          docker run -d --name frontend-smoke -p 3000:80 helpdesktool-frontend:ci
          ok=""
          for _ in $(seq 1 20); do
            if curl -fs http://localhost:3000/ >/dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs frontend-smoke
          docker rm -f frontend-smoke
          [ -n "$ok" ] || (echo "frontend container never became healthy" && exit 1)
      - name: Publish and keylessly sign the frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}-frontend
        run: |
          image="${IMAGE,,}"
          docker tag helpdesktool-frontend:ci "$image:${{ github.sha }}"
          docker tag helpdesktool-frontend:ci "$image:latest"
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
          digest=$(docker image inspect --format='{{index .RepoDigests 0}}' "$image:${{ github.sha }}")
          cosign sign --yes "$digest"
          cosign verify "$digest" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
