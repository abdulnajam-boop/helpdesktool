[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesktool"
version = "0.1.0"
description = "Safety-first orchestration core for an autonomous IT help desk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "alembic>=1.13,<2",
    "cryptography>=48.0.1,<51",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.20,<1",
    "pydantic-settings>=2.6,<3",
    "pyjwt[crypto]>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=8,<10", "ruff>=0.8,<1"]
# psutil is genuinely cross-platform (installs and runs fine on Linux, which
# is what makes windows_agent's collector/executor *logic* testable in CI).
# pywin32 is Windows-only on PyPI — the sys_platform marker makes pip skip
# it entirely on non-Windows instead of failing the install; only actually
# constructing windows_agent.win32_service_manager.Win32ServiceManager (real
# Win32 API calls, never imported at module level elsewhere) requires it.
windows = ["psutil>=6,<8", "pywin32>=306; sys_platform == \"win32\""]

[project.scripts]
helpdesk-linux-agent = "linux_agent.agent:main"
helpdesk-windows-agent = "windows_agent.agent:main"
helpdesk-windows-agent-service = "windows_agent.service:main"
helpdesk-webhook-worker = "helpdesktool.webhook_worker:main"
helpdesk-lease-reaper = "helpdesktool.lease_reaper:main"
helpdesk-connector-request-reaper = "helpdesktool.connector_request_reaper:main"
helpdesk-retention-worker = "helpdesktool.retention_worker:main"
helpdesk-seed = "helpdesktool.seed:seed"

[project.urls]
Homepage = "https://github.com/abdulnajam-boop/helpdesktool"
Repository = "https://github.com/abdulnajam-boop/helpdesktool.git"
Issues = "https://github.com/abdulnajam-boop/helpdesktool/issues"

[tool.setuptools.packages.find]
include = ["helpdesktool*", "agent_common*", "linux_agent*", "windows_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
platform = "linux"
strict = true
packages = ["helpdesktool", "agent_common", "linux_agent"]
